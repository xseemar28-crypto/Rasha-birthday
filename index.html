<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rasha's Birthday</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       GENERAL
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
      background: #f9dce5;
      color: #694d58;
      font-family: "Cormorant Garamond", serif;
    }

    button {
      font-family: inherit;
    }

    .screen {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: none;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.65), transparent 24%),
        radial-gradient(circle at 85% 75%, rgba(255,255,255,0.55), transparent 25%),
        linear-gradient(135deg, #f8dbe4, #f6d2de 50%, #f9e0e7);
    }

    .screen.active {
      display: flex;
    }

    .content {
      position: relative;
      z-index: 10;
      width: min(92%, 480px);
      text-align: center;
    }


    /* =====================================================
       DECORATIVE FRAME
    ===================================================== */

    .frame {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(153, 91, 112, 0.25);
      border-radius: 25px;
      pointer-events: none;
      z-index: 2;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      border: 1px solid rgba(153, 91, 112, 0.20);
      border-radius: 50%;
    }

    .frame::before {
      top: -35px;
      left: -35px;
    }

    .frame::after {
      bottom: -35px;
      right: -35px;
    }


    /* =====================================================
       DECORATIONS
    ===================================================== */

    .decorations {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .sparkle {
      position: absolute;
      color: rgba(153, 91, 112, 0.55);
      font-family: Georgia, serif;
      line-height: 1;
    }

    .sparkle::before {
      content: "✦";
    }

    .sparkle.one {
      top: 11%;
      left: 11%;
      font-size: 19px;
    }

    .sparkle.two {
      top: 19%;
      right: 13%;
      font-size: 13px;
    }

    .sparkle.three {
      bottom: 18%;
      left: 13%;
      font-size: 14px;
    }

    .sparkle.four {
      bottom: 11%;
      right: 11%;
      font-size: 21px;
    }

    .sparkle.five {
      top: 38%;
      left: 5%;
      font-size: 10px;
    }

    .sparkle.six {
      top: 48%;
      right: 6%;
      font-size: 10px;
    }

    .tiny-star {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(153, 91, 112, 0.30);
    }

    .tiny-star.a {
      top: 27%;
      left: 18%;
    }

    .tiny-star.b {
      top: 32%;
      right: 20%;
    }

    .tiny-star.c {
      bottom: 28%;
      right: 17%;
    }

    .tiny-star.d {
      bottom: 32%;
      left: 20%;
    }


    /* =====================================================
       BOWS
    ===================================================== */

    .bow {
      position: absolute;
      width: 42px;
      height: 28px;
      opacity: 0.72;
    }

    .bow::before,
    .bow::after {
      content: "";
      position: absolute;
      top: 2px;
      width: 22px;
      height: 22px;
      border: 2px solid #c48a9c;
      background: rgba(255,255,255,0.20);
    }

    .bow::before {
      left: 0;
      border-radius: 65% 35% 55% 45%;
      transform: rotate(18deg);
    }

    .bow::after {
      right: 0;
      border-radius: 35% 65% 45% 55%;
      transform: rotate(-18deg);
    }

    .bow .knot {
      position: absolute;
      width: 9px;
      height: 9px;
      background: #c48a9c;
      border-radius: 50%;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      z-index: 2;
    }

    .bow .tail-left,
    .bow .tail-right {
      position: absolute;
      top: 19px;
      width: 2px;
      height: 16px;
      background: #c48a9c;
    }

    .bow .tail-left {
      left: 17px;
      transform: rotate(28deg);
    }

    .bow .tail-right {
      right: 17px;
      transform: rotate(-28deg);
    }

    .bow.top-left {
      top: 7%;
      left: 8%;
      transform: rotate(-10deg);
    }

    .bow.top-right {
      top: 8%;
      right: 8%;
      transform: rotate(12deg);
    }


    /* =====================================================
       TULIPS
    ===================================================== */

    .tulip {
      position: absolute;
      width: 34px;
      height: 70px;
      opacity: 0.55;
    }

    .tulip .flower {
      position: absolute;
      top: 0;
      left: 5px;
      width: 24px;
      height: 25px;
      background: #d895a9;
      border-radius: 45% 45% 50% 50%;
    }

    .tulip .flower::before {
      content: "";
      position: absolute;
      left: 9px;
      top: -3px;
      width: 7px;
      height: 12px;
      background: #d895a9;
      border-radius: 50%;
    }

    .tulip .stem {
      position: absolute;
      left: 16px;
      top: 21px;
      width: 2px;
      height: 45px;
      background: #83a07f;
    }

    .tulip .leaf {
      position: absolute;
      width: 17px;
      height: 9px;
      border-radius: 100% 0;
      background: #83a07f;
      top: 40px;
      left: 1px;
      transform: rotate(-25deg);
    }

    .tulip.left {
      bottom: 7%;
      left: 8%;
      transform: rotate(-7deg);
    }

    .tulip.right {
      bottom: 7%;
      right: 8%;
      transform: scaleX(-1) rotate(-7deg);
    }


    /* =====================================================
       ANGEL / HALO DECOR
    ===================================================== */

    .halo {
      position: absolute;
      width: 32px;
      height: 16px;
      border: 1.5px solid rgba(187, 147, 157, 0.45);
      border-radius: 50%;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
    }

    .angel-wing {
      position: absolute;
      width: 24px;
      height: 38px;
      border: 1px solid rgba(187, 147, 157, 0.25);
      border-radius: 70% 30% 70% 30%;
      opacity: 0.6;
    }

    .angel-wing.left {
      top: 16%;
      left: 6%;
      transform: rotate(-30deg);
    }

    .angel-wing.right {
      top: 16%;
      right: 6%;
      transform: scaleX(-1) rotate(-30deg);
    }


    /* =====================================================
       HEADINGS
    ===================================================== */

    .main-title {
      font-size: clamp(38px, 9vw, 58px);
      line-height: 1;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #704f5c;
      margin-bottom: 5px;
    }

    .arabic-title {
      direction: rtl;
      font-family: "Amiri", serif;
      font-size: clamp(24px, 6vw, 31px);
      color: #8a6070;
      margin-bottom: 30px;
    }

    .subtitle {
      font-size: clamp(20px, 5vw, 25px);
      color: #8b6271;
      margin-top: 10px;
    }

    .subtitle-small {
      font-size: clamp(17px, 4.5vw, 21px);
      color: #9a7180;
      margin-top: 7px;
    }


    /* =====================================================
       PASSWORD DOTS
    ===================================================== */

    .password-dots {
      display: flex;
      justify-content: center;
      gap: 13px;
      margin: 8px 0 25px;
      min-height: 34px;
    }

    .password-dot {
      width: 17px;
      height: 17px;
      border: 1.7px solid #a66e82;
      border-radius: 50%;
      background: transparent;
      transition: 0.2s ease;
    }

    .password-dot.filled {
      background: #a66e82;
      box-shadow: 0 2px 8px rgba(122, 73, 91, 0.15);
    }


    /* =====================================================
       HINT
    ===================================================== */

    .hint {
      margin-bottom: 20px;
      color: #8b6572;
    }

    .hint-title {
      font-size: 19px;
      font-weight: 600;
      font-style: italic;
    }

    .hint-text {
      font-size: 22px;
      margin-top: 1px;
      color: #765260;
    }


/* =====================================================
   NUMBER PAD — FIXED & ALWAYS VISIBLE
===================================================== */

.number-pad {
  position: relative;
  z-index: 50;

  width: 310px;
  max-width: 90vw;

  margin: 20px auto 0;

  display: grid !important;
  grid-template-columns: repeat(3, 1fr) !important;
  grid-template-rows: repeat(4, 58px) !important;

  gap: 10px;

  visibility: visible !important;
  opacity: 1 !important;
}

.number-btn {
  position: relative;
  z-index: 51;

  display: flex !important;
  align-items: center !important;
  justify-content: center !important;

  width: 100% !important;
  height: 58px !important;

  padding: 0 !important;
  margin: 0 !important;

  border: 1px solid rgba(158, 96, 117, 0.35) !important;
  border-radius: 16px !important;

  background: #fff1f5 !important;

  color: #765360 !important;

  font-family: "Cormorant Garamond", serif !important;
  font-size: 29px !important;
  font-weight: 600 !important;

  line-height: 1 !important;

  cursor: pointer;

  visibility: visible !important;
  opacity: 1 !important;

  box-shadow: 0 4px 12px rgba(126, 75, 93, 0.10);

  -webkit-appearance: none;
  appearance: none;
}

.number-btn:hover {
  background: #ffe5ed !important;
}

.number-btn:active {
  transform: scale(0.94);
  background: #f4ccd9 !important;
}

    /* =====================================================
       ERROR MODAL
    ===================================================== */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(89, 53, 66, 0.20);
      backdrop-filter: blur(4px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      position: relative;
      width: min(88vw, 350px);
      padding: 27px 25px 24px;
      border: 1px solid rgba(170, 104, 126, 0.28);
      border-radius: 24px;
      background: #fff5f8;
      box-shadow: 0 18px 45px rgba(84, 49, 63, 0.20);
      text-align: center;
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 13px;
      width: 25px;
      height: 25px;
      border: none;
      background: transparent;
      color: #c67f99;
      font-family: Arial, sans-serif;
      font-size: 21px;
      cursor: pointer;
      line-height: 25px;
    }

    .miko-image {
      display: block;
      width: 115px;
      height: 115px;
      object-fit: cover;
      margin: 5px auto 15px;
      border-radius: 50%;
      border: 2px solid rgba(191, 119, 141, 0.35);
      background: #f8dce5;
    }

    .error-title {
      font-size: 34px;
      color: #76515f;
      margin-bottom: 4px;
    }

    .error-text {
      font-size: 20px;
      line-height: 1.25;
      color: #8d6875;
      margin-bottom: 18px;
    }

    .ok-btn {
      min-width: 100px;
      padding: 8px 22px;
      border: 1px solid rgba(165, 93, 116, 0.30);
      border-radius: 20px;
      background: #e9afc1;
      color: #fff;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .ok-btn:active {
      transform: scale(0.95);
    }


    /* =====================================================
       ENVELOPE SCREEN
    ===================================================== */

    .envelope-content {
      width: min(92%, 520px);
    }

    .envelope-title {
      font-size: clamp(34px, 8vw, 49px);
      line-height: 1.05;
      font-weight: 600;
      color: #704f5c;
    }

    .envelope-subtitle {
      margin-top: 10px;
      font-size: clamp(18px, 4.7vw, 23px);
      color: #92707d;
    }

    .envelope-wrapper {
      margin: 38px auto 35px;
      width: min(82vw, 360px);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s ease;
    }

    .envelope-wrapper:hover {
      transform: translateY(-4px);
    }

    .envelope-wrapper:active {
      transform: scale(0.97);
    }

    .envelope {
      position: relative;
      width: 100%;
      aspect-ratio: 1.55 / 1;
      filter: drop-shadow(0 13px 13px rgba(94, 57, 68, 0.14));
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      border-radius: 9px;
      background: #f0dfc9;
      border: 1px solid rgba(135, 101, 78, 0.20);
    }

    .envelope-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: #e8d3bb;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      border-radius: 8px 0 0 8px;
    }

    .envelope-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 50%;
      height: 100%;
      background: #e6cfb5;
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
      border-radius: 0 8px 8px 0;
    }

    .envelope-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 72%;
      background: #f3e2ce;
      clip-path: polygon(0 100%, 50% 25%, 100% 100%);
      border-radius: 0 0 9px 9px;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 65%;
      background: #f7e7d3;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-radius: 9px 9px 0 0;
      z-index: 5;
      transform-origin: top center;
      transition: transform 0.65s ease;
    }

    .wax-seal {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #d887a2;
      border: 3px solid rgba(255,255,255,0.30);
      box-shadow:
        0 4px 10px rgba(108, 62, 78, 0.18),
        inset 0 0 0 2px rgba(165, 87, 111, 0.22);
    }

    .wax-seal::before {
      content: "♡";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff1f5;
      font-family: Georgia, serif;
      font-size: 28px;
    }

    .envelope-wrapper.opening .envelope-flap {
      transform: rotateX(180deg);
    }


    /* =====================================================
       GO BACK
    ===================================================== */

    .back-btn {
      border: none;
      background: transparent;
      color: #87616e;
      font-size: 21px;
      letter-spacing: 0.04em;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
      padding: 8px 15px;
      transition: 0.15s ease;
    }

    .back-btn:hover {
      color: #b06d84;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-height: 700px) {
      .main-title {
        font-size: 40px;
      }

      .arabic-title {
        font-size: 23px;
        margin-bottom: 17px;
      }

      .hint {
        margin-bottom: 13px;
      }

      .number-pad {
        gap: 7px;
      }

      .number-btn {
        height: 47px;
        font-size: 24px;
      }

      .envelope-wrapper {
        margin-top: 25px;
        margin-bottom: 22px;
      }
    }

    @media (max-width: 360px) {
      .number-pad {
        width: 275px;
      }

      .number-btn {
        height: 53px;
      }

      .frame {
        inset: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       SCREEN 1 — PASSWORD
  ===================================================== -->

  <section id="passwordScreen" class="screen active">

    <div class="frame"></div>

    <div class="decorations">
      <div class="sparkle one"></div>
      <div class="sparkle two"></div>
      <div class="sparkle three"></div>
      <div class="sparkle four"></div>
      <div class="sparkle five"></div>
      <div class="sparkle six"></div>

      <div class="tiny-star a"></div>
      <div class="tiny-star b"></div>
      <div class="tiny-star c"></div>
      <div class="tiny-star d"></div>

      <div class="bow top-left">
        <div class="knot"></div>
        <div class="tail-left"></div>
        <div class="tail-right"></div>
      </div>

      <div class="bow top-right">
        <div class="knot"></div>
        <div class="tail-left"></div>
        <div class="tail-right"></div>
      </div>

      <div class="tulip left">
        <div class="flower"></div>
        <div class="stem"></div>
        <div class="leaf"></div>
      </div>

      <div class="tulip right">
        <div class="flower"></div>
        <div class="stem"></div>
        <div class="leaf"></div>
      </div>

      <div class="halo"></div>
      <div class="angel-wing left"></div>
      <div class="angel-wing right"></div>
    </div>


    <div class="content">

      <h1 class="main-title">Enter the Password</h1>

      <div class="arabic-title">
        أدخلي كلمة السر
      </div>

      <!-- Password circles -->
      <div id="passwordDots" class="password-dots">
        <div class="password-dot"></div>
        <div class="password-dot"></div>
        <div class="password-dot"></div>
      </div>

      <!-- Hint -->
      <div class="hint">
        <div class="hint-title">A little hint from Miko:</div>
        <div class="hint-text">I love you</div>
      </div>

      <!-- Number Pad -->
      <div class="number-pad">

        <button class="number-btn" data-number="1">1</button>
        <button class="number-btn" data-number="2">2</button>
        <button class="number-btn" data-number="3">3</button>

        <button class="number-btn" data-number="4">4</button>
        <button class="number-btn" data-number="5">5</button>
        <button class="number-btn" data-number="6">6</button>

        <button class="number-btn" data-number="7">7</button>
        <button class="number-btn" data-number="8">8</button>
        <button class="number-btn" data-number="9">9</button>

        <button class="number-btn" data-number="*">*</button>
        <button class="number-btn" data-number="0">0</button>
        <button class="number-btn" data-number="#">#</button>

      </div>

    </div>
  </section>


  <!-- =====================================================
       ERROR MODAL
  ===================================================== -->

  <div id="errorModal" class="modal-overlay">

    <div class="modal">

      <button id="closeModal" class="close-modal" aria-label="Close">
        ×
      </button>

      <!-- =================================================
           ضعِي صورة Miko هنا
           غيّري YOUR_MIKO_IMAGE.png فقط
           
           مثال:
           src="miko.png"
           
           أو:
           src="images/miko.png"
      ================================================== -->

      <img
        class="miko-image"
        src="YOUR_MIKO_IMAGE.png"
        alt="Miko"
      >

      <h2 class="error-title">
        Oh, no…
      </h2>

      <p class="error-text">
        You must enter the right password.
      </p>

      <button id="okButton" class="ok-btn">
        OK
      </button>

    </div>
  </div>


  <!-- =====================================================
       SCREEN 2 — ENVELOPE
  ========================================
