<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise</title>

    <!-- =====================================================
         ELEGANT FONTS
         English: Cormorant Garamond
         Arabic: Amiri
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        /* =====================================================
           BASIC
           ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #fcecef;
            color: #54263b;
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
        }


        /* =====================================================
           MAIN CONTAINER
           ===================================================== */

        .page {
            position: relative;
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 25px;

            overflow: hidden;
        }


        /* =====================================================
           DECORATIVE FRAME
           ===================================================== */

        .frame {
            position: fixed;
            inset: 18px;

            border: 1px solid rgba(177, 100, 131, 0.42);

            pointer-events: none;
            z-index: 2;
        }

        .frame::before {
            content: "";

            position: absolute;
            inset: 7px;

            border: 1px solid rgba(177, 100, 131, 0.20);
        }


        /* =====================================================
           FRAME DECORATIONS
           ===================================================== */

        .frame-decoration {
            position: absolute;

            color: #cf91aa;

            font-family: Georgia, serif;

            font-size: 25px;
        }

        .top-left {
            top: -7px;
            left: -5px;
        }

        .top-right {
            top: -7px;
            right: -5px;
            transform: scaleX(-1);
        }

        .bottom-left {
            bottom: -7px;
            left: -5px;
            transform: scaleY(-1);
        }

        .bottom-right {
            bottom: -7px;
            right: -5px;
            transform: scale(-1);
        }


        /* =====================================================
           DECORATIVE SPARKLES
           ===================================================== */

        .sparkle {
            position: fixed;

            color: #d99ab1;

            font-family: Georgia, serif;

            pointer-events: none;

            z-index: 3;
        }

        .sparkle-1 {
            top: 11%;
            left: 12%;
            font-size: 21px;
        }

        .sparkle-2 {
            top: 18%;
            right: 13%;
            font-size: 28px;
        }

        .sparkle-3 {
            bottom: 17%;
            left: 13%;
            font-size: 17px;
        }

        .sparkle-4 {
            bottom: 11%;
            right: 14%;
            font-size: 25px;
        }

        .sparkle-5 {
            top: 38%;
            left: 6%;
            font-size: 14px;
        }

        .sparkle-6 {
            top: 43%;
            right: 6%;
            font-size: 15px;
        }


        /* =====================================================
           BOWS
           ===================================================== */

        .bow {
            position: fixed;

            color: #d486a4;

            font-family: Georgia, serif;

            font-size: 36px;

            opacity: 0.75;

            pointer-events: none;

            z-index: 3;
        }

        .bow-left {
            top: 8%;
            left: 5%;
        }

        .bow-right {
            bottom: 8%;
            right: 5%;
        }


        /* =====================================================
           SMALL FLOWER DECORATION
           ===================================================== */

        .flower {
            position: fixed;

            color: #d79bb0;

            font-family: Georgia, serif;

            font-size: 27px;

            opacity: 0.65;

            pointer-events: none;

            z-index: 3;
        }

        .flower-left {
            bottom: 28%;
            left: 6%;
        }

        .flower-right {
            top: 29%;
            right: 6%;
        }


        /* =====================================================
           PASSWORD SCREEN
           ===================================================== */

        .lock-screen {
            width: 100%;
            max-width: 540px;

            text-align: center;

            position: relative;

            z-index: 5;
        }


        /* =====================================================
           TITLE
           ===================================================== */

        .title {
            font-family: 'Cormorant Garamond', serif;

            font-size: clamp(2.4rem, 7vw, 3.8rem);

            font-weight: 600;

            color: #57263d;

            letter-spacing: 1px;

            margin-bottom: 5px;
        }


        .arabic-title {
            font-family: 'Amiri', serif;

            font-size: 1.45rem;

            color: #9b6178;

            margin-bottom: 25px;
        }


        /* =====================================================
           PASSWORD DOTS
           ===================================================== */

        .password-dots {
            display: flex;

            justify-content: center;

            gap: 13px;

            margin: 20px 0 12px;
        }

        .dot {
            width: 13px;
            height: 13px;

            border-radius: 50%;

            background: #edbfd0;

            transition: 0.2s ease;
        }

        .dot.active {
            background: #a85578;

            transform: scale(1.12);
        }


        /* =====================================================
           HINT
           ===================================================== */

        .hint {
            font-size: 1.18rem;

            color: #a0647c;

            margin-bottom: 30px;

            letter-spacing: 0.3px;
        }

        .hint strong {
            color: #8d4563;

            font-weight: 600;
        }


        /* =====================================================
           KEYPAD
           ===================================================== */

        .keypad {
            width: 275px;

            margin: 0 auto;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 13px;
        }


        .key {
            width: 78px;
            height: 78px;

            border-radius: 50%;

            border: 1px solid rgba(160, 86, 115, 0.20);

            background: rgba(255, 255, 255, 0.78);

            color: #54263b;

            font-family: 'Cormorant Garamond', serif;

            font-size: 2rem;

            font-weight: 600;

            cursor: pointer;

            display: flex;

            justify-content: center;
            align-items: center;

            transition: 0.2s ease;

            box-shadow: 0 4px 12px rgba(100, 48, 70, 0.05);
        }

        .key:hover {
            transform: translateY(-3px);

            background: #fff8fa;

            box-shadow: 0 8px 20px rgba(100, 48, 70, 0.10);
        }

        .key:active {
            transform: scale(0.92);
        }


        /* =====================================================
           ERROR POPUP
           ===================================================== */

        .error-card {
            position: fixed;

            inset: 0;

            background: rgba(73, 36, 53, 0.20);

            backdrop-filter: blur(5px);

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            visibility: hidden;

            transition: 0.3s ease;

            z-index: 100;
        }

        .error-card.show {
            opacity: 1;

            visibility: visible;
        }


        .error-box {
            position: relative;

            width: min(88vw, 390px);

            background: #fff9fb;

            border: 1px solid #e3a7ba;

            border-radius: 25px;

            padding: 30px 25px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(89, 38, 61, 0.18);
        }


        /* =====================================================
           ERROR X
           ===================================================== */

        .error-x {
            position: absolute;

            top: 13px;
            right: 14px;

            width: 31px;
            height: 31px;

            border-radius: 50%;

            background: #f6cfdd;

            color: #ad5878;

            font-family: Arial, sans-serif;

            font-size: 21px;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        /* =====================================================
           ERROR IMAGE
           
           >>> PUT YOUR IMAGE HERE <<<
           
           Replace:
           YOUR_ERROR_IMAGE.png
           
           with your image name.
           ===================================================== */

        .error-image {
            width: 145px;
            height: 145px;

            object-fit: cover;

            border-radius: 50%;

            display: block;

            margin: 0 auto 17px;

            background: #fce6ed;

            border: 5px solid #f8dce5;
        }


        .error-title {
            font-family: 'Cormorant Garamond', serif;

            font-size: 2.2rem;

            font-weight: 600;

            color: #8e4563;

            margin-bottom: 3px;
        }


        .error-text {
            font-family: 'Cormorant Garamond', serif;

            font-size: 1.25rem;

            color: #a2667d;

            line-height: 1.3;

            margin-bottom: 20px;
        }


        /* =====================================================
           OK BUTTON
           ===================================================== */

        .error-ok {
            border: none;

            background: #e4a0b7;

            color: white;

            padding: 8px 30px;

            border-radius: 22px;

            font-family: 'Cormorant Garamond', serif;

            font-size: 1.2rem;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .error-ok:hover {
            background: #d785a1;

            transform: translateY(-2px);
        }


        /* =====================================================
           ENVELOPE PAGE
           ===================================================== */

        .envelope-page {
            display: none;

            width: 100%;
            max-width: 700px;

            min-height: 80vh;

            text-align: center;

            position: relative;

            z-index: 5;

            padding: 35px 20px;
        }


        /* =====================================================
           ENVELOPE TITLE
           ===================================================== */

        .envelope-title {
            font-family: 'Cormorant Garamond', serif;

            font-size: clamp(2.2rem, 6vw, 3.4rem);

            font-weight: 600;

            color: #58263d;

            letter-spacing: 0.8px;

            margin-bottom: 7px;
        }


        .envelope-subtitle {
            font-family: 'Cormorant Garamond', serif;

            font-size: 1.2rem;

            color: #a36980;

            margin-bottom: 32px;
        }


        /* =====================================================
           ENVELOPE BUTTON
           ===================================================== */

        .envelope-button {
            border: none;

            background: transparent;

            padding: 20px;

            cursor: pointer;

            transition: transform 0.25s ease;
        }

        .envelope-button:hover {
            transform: translateY(-6px);
        }

        .envelope-button:active {
            transform: scale(0.96);
        }


        /* =====================================================
           BEIGE ENVELOPE
           ===================================================== */

        .envelope {
            position: relative;

            width: 320px;
            height: 210px;

            margin: auto;

            background: #ead7b9;

            border: 1px solid #d5ba91;

            border-radius: 5px;

            overflow: hidden;

            box-shadow:
                0 18px 35px rgba(93, 57, 52, 0.16);
        }


        /* Bottom fold */

        .envelope::before {
            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 0;
            height: 0;

            border-left: 160px solid transparent;
            border-right: 160px solid transparent;

            border-bottom: 110px solid #e2c9a5;

            z-index: 3;
        }


        /* Top fold */

        .envelope::after {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 0;
            height: 0;

            border-left: 160px solid transparent;
            border-right: 160px solid transparent;

            border-top: 115px solid #f0dfc5;

            z-index: 4;
        }


        /* =====================================================
           LETTER INSIDE ENVELOPE
           ===================================================== */

        .letter {
            position: absolute;

            width: 195px;
            height: 140px;

            left: 62px;
            top: 34px;

            background: #fffaf1;

            border: 1px solid #e6d6bd;

            z-index: 2;

            box-shadow:
                0 4px 12px rgba(80, 50, 40, 0.08);
        }


        /* =====================================================
           PINK WAX SEAL
           ===================================================== */

        .wax-seal {
            position: absolute;

            width: 57px;
            height: 57px;

            left: 50%;
            top: 51%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: #d982a1;

            border: 3px solid #c96e91;

            color: #fff4f8;

            font-family: Georgia, serif;

            font-size: 25px;

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 10;

            box-shadow:
                0 5px 10px rgba(130, 62, 84, 0.18);
        }


        /* =====================================================
           GO BACK
           ===================================================== */

        .go-back {
            display: block;

            margin: 30px auto 0;

            border: none;

            background: transparent;

            color: #8f536d;

            font-family: 'Cormorant Garamond', serif;

            font-size: 1.2rem;

            cursor: pointer;

            text-decoration: underline;

            text-underline-offset: 5px;
        }

        .go-back:hover {
            color: #c16d8e;
        }


        /* =====================================================
           ENVELOPE DECORATIONS
           ===================================================== */

        .envelope-sparkle {
            position: absolute;

            color: #d598ae;

            font-family: Georgia, serif;

            pointer-events: none;
        }

        .es-1 {
            top: 9%;
            left: 18%;
            font-size: 24px;
        }

        .es-2 {
            top: 22%;
            right: 16%;
            font-size: 18px;
        }

        .es-3 {
            bottom: 18%;
            left: 19%;
            font-size: 20px;
        }

        .es-4 {
            bottom: 10%;
            right: 20%;
            font-size: 27px;
        }


        .envelope-bow {
            position: absolute;

            color: #d486a4;

            font-family: Georgia, serif;

            font-size: 36px;

            opacity: 0.75;
        }

        .eb-left {
            top: 8%;
            left: 7%;
        }

        .eb-right {
            bottom: 8%;
            right: 7%;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 500px) {

            .page {
                padding: 45px 15px;
            }

            .frame {
                inset: 10px;
            }

            .keypad {
                width: 250px;
                gap: 10px;
            }

            .key {
                width: 72px;
                height: 72px;
            }

            .envelope {
                width: 275px;
                height: 182px;
            }

            .envelope::before {
                border-left-width: 137px;
                border-right-width: 137px;
                border-bottom-width: 96px;
            }

            .envelope::after {
                border-left-width: 137px;
                border-right-width: 137px;
                border-top-width: 100px;
            }

            .letter {
                width: 165px;
                height: 120px;

                left: 54px;
                top: 30px;
            }

            .wax-seal {
                width: 50px;
                height: 50px;
            }

            .bow-left {
                left: 2%;
            }

            .bow-right {
                right: 2%;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         PAGE
         ===================================================== -->

    <main class="page">


        <!-- =================================================
             DECORATIVE FRAME
             ================================================= -->

        <div class="frame">

            <div class="frame-decoration top-left">✦</div>
            <div class="frame-decoration top-right">✦</div>

            <div class="frame-decoration bottom-left">✦</div>
            <div class="frame-decoration bottom-right">✦</div>

        </div>


        <!-- =================================================
             DECORATIONS
             ================================================= -->

        <div class="sparkle sparkle-1">✧</div>
        <div class="sparkle sparkle-2">✦</div>
        <div class="sparkle sparkle-3">⋆</div>
        <div class="sparkle sparkle-4">✧</div>
        <div class="sparkle sparkle-5">·</div>
        <div class="sparkle sparkle-6">✦</div>

        <div class="bow bow-left">୨୧</div>
        <div class="bow bow-right">୨୧</div>

        <div class="flower flower-left">❀</div>
        <div class="flower flower-right">❀</div>


        <!-- =====================================================
             PASSWORD SCREEN
