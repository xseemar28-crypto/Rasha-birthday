<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise</title>

    <!-- =========================
         ELEGANT FONTS
         ========================= -->

    <!-- English: Cormorant Garamond
         Arabic: Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">


    <style>

        /* ==================================================
           BASIC SETTINGS
           ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #fcecef;
            color: #54263b;
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }


        /* ==================================================
           MAIN PAGE
           ================================================== */

        .page {
            position: relative;
            width: min(92vw, 900px);
            min-height: 92vh;
            padding: 55px 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ==================================================
           DECORATIVE FRAME
           ================================================== */

        .frame {
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(177, 100, 131, 0.45);
            pointer-events: none;
        }

        .frame::before {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1px solid rgba(177, 100, 131, 0.22);
        }

        .frame-corner {
            position: absolute;
            width: 55px;
            height: 55px;
            color: #c98da7;
            font-size: 28px;
            line-height: 1;
        }

        .corner-tl {
            top: 8px;
            left: 8px;
        }

        .corner-tr {
            top: 8px;
            right: 8px;
            transform: scaleX(-1);
        }

        .corner-bl {
            bottom: 8px;
            left: 8px;
            transform: scaleY(-1);
        }

        .corner-br {
            bottom: 8px;
            right: 8px;
            transform: scale(-1);
        }


        /* ==================================================
           DECORATIVE SYMBOLS
           These are NOT emojis.
           ================================================== */

        .sparkle {
            position: absolute;
            color: #d49ab0;
            font-family: Georgia, serif;
            pointer-events: none;
        }

        .sparkle.one {
            top: 70px;
            left: 13%;
            font-size: 18px;
        }

        .sparkle.two {
            top: 145px;
            right: 13%;
            font-size: 25px;
        }

        .sparkle.three {
            bottom: 110px;
            left: 12%;
            font-size: 21px;
        }

        .sparkle.four {
            bottom: 175px;
            right: 11%;
            font-size: 16px;
        }


        /* ==================================================
           TULIP DECORATIONS
           ================================================== */

        .tulip {
            position: absolute;
            color: #d69ab0;
            opacity: 0.75;
            font-size: 30px;
            font-family: Georgia, serif;
        }

        .tulip.left {
            left: 5%;
            bottom: 24%;
            transform: rotate(-10deg);
        }

        .tulip.right {
            right: 5%;
            top: 25%;
            transform: rotate(10deg);
        }


        /* ==================================================
           LOCK SCREEN
           ================================================== */

        .lock-screen {
            width: 100%;
            max-width: 520px;
            text-align: center;
            position: relative;
            z-index: 5;
        }


        /* ==================================================
           TITLE
           ================================================== */

        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.2rem, 6vw, 3.5rem);
            font-weight: 600;
            letter-spacing: 1px;
            color: #58263d;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #a2637e;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }


        /* Arabic text */

        .arabic {
            font-family: 'Amiri', serif;
        }


        /* ==================================================
           PASSWORD DOTS
           ================================================== */

        .password-dots {
            display: flex;
            justify-content: center;
            gap: 13px;
            margin: 25px 0 15px;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #e7a8bd;
            transition: 0.2s ease;
        }

        .dot.active {
            background: #9d5473;
            transform: scale(1.1);
        }


        /* ==================================================
           HINT
           ================================================== */

        .hint {
            margin-bottom: 30px;
            color: #9a647a;
            font-size: 1.15rem;
            font-style: italic;
        }


        /* ==================================================
           KEYPAD
           ================================================== */

        .keypad {
            width: 270px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 13px;
        }

        .key {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 1px solid rgba(160, 86, 115, 0.2);
            background: rgba(255, 255, 255, 0.72);

            color: #57263d;

            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;

            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease;
        }

        .key:hover {
            transform: translateY(-3px);
            background: #fff7fa;
            box-shadow: 0 7px 18px rgba(132, 67, 95, 0.12);
        }

        .key:active {
            transform: scale(0.93);
        }


        /* ==================================================
           ERROR CARD
           ================================================== */

        .error-card {
            position: fixed;
            inset: 0;

            background: rgba(73, 36, 53, 0.18);
            backdrop-filter: blur(5px);

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 0;
            visibility: hidden;

            transition: 0.3s ease;

            z-index: 50;
        }

        .error-card.show {
            opacity: 1;
            visibility: visible;
        }

        .error-box {
            width: min(85vw, 380px);
            background: #fff9fb;

            border: 1px solid #e4a8bb;
            border-radius: 24px;

            padding: 28px 25px 30px;

            text-align: center;

            position: relative;

            box-shadow:
                0 20px 60px rgba(89, 38, 61, 0.18);
        }


        /* Cute X */

        .close-error {
            position: absolute;
            top: 12px;
            right: 15px;

            width: 30px;
            height: 30px;

            border: none;
            background: #f7d5df;

            color: #a24e70;

            border-radius: 50%;

            font-family: Arial, sans-serif;
            font-size: 18px;

            cursor: pointer;
        }


        /* ==================================================
           ERROR IMAGE
           
           PUT YOUR IMAGE HERE:
           Replace YOUR_ERROR_IMAGE.jpg
           ================================================== */

        .error-image {
            width: 150px;
            height: 150px;

            margin: 5px auto 18px;

            border-radius: 50%;

            object-fit: cover;

            border: 5px solid #f8dce5;

            background: #fcebef;

            display: block;
        }


        .error-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: #8d4563;
            margin-bottom: 4px;
        }

        .error-text {
            font-size: 1.15rem;
            color: #a36b82;
        }


        /* ==================================================
           HIDDEN BIRTHDAY PAGE
           ================================================== */

        .birthday-page {
            display: none;
        }


        /* ==================================================
           IMAGE PLACEHOLDER SECTION
           
           WHEN YOU ADD YOUR IMAGES:
           
           Replace:
           YOUR_IMAGE_HERE.jpg
           
           with your actual image file name.
           
           Example:
           <img src="rasha1.jpg">
           ================================================== */

        .photo-placeholder {
            width: 220px;
            height: 220px;

            object-fit: cover;

            border-radius: 18px;

            border: 1px solid #dca4b8;

            background: #fff7fa;
        }


        /* ==================================================
           THREE FRIENDS PHOTO
           ================================================== */

        .friends-photo {
            width: 270px;
            height: 190px;

            object-fit: cover;

            border-radius: 22px;

            border: 2px solid #e1a8bb;

            background: #fff7fa;

            display: block;
            margin: 20px auto;
        }


        /* ==================================================
           HEART PHOTO FRAME
           ================================================== */

        .heart-photo {
            width: 220px;
            height: 220px;

            object-fit: cover;

            clip-path: path(
                "M110 200
                 C100 190 20 135 20 70
                 C20 20 80 10 110 55
                 C140 10 200 20 200 70
                 C200 135 120 190 110 200 Z"
            );

            background: #f9dbe5;
        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 500px) {

            .page {
                width: 100vw;
                min-height: 100vh;
                padding: 45px 20px;
            }

            .frame {
                inset: 10px;
            }

            .keypad {
                width: 250px;
                gap: 10px;
            }

            .key {
                width: 72px;
                height: 72px;
            }

            .tulip.left {
                left: 2%;
            }

            .tulip.right {
                right: 2%;
            }

        }

    </style>
</head>


<body>


    <!-- ==================================================
         MAIN PAGE
         ================================================== -->

    <main class="page">


        <!-- Decorative frame -->

        <div class="frame">

            <div class="frame-corner corner-tl">✦</div>
            <div class="frame-corner corner-tr">✦</div>
            <div class="frame-corner corner-bl">✦</div>
            <div class="frame-corner corner-br">✦</div>

        </div>


        <!-- Decorative stars -->

        <div class="sparkle one">✧</div>
        <div class="sparkle two">✦</div>
        <div class="sparkle three">✧</div>
        <div class="sparkle four">⋆</div>


        <!-- Tulip decorations -->

        <div class="tulip left">❀</div>
        <div class="tulip right">❀</div>


        <!-- ==================================================
             LOCK SCREEN
             ================================================== -->

        <section class="lock-screen" id="lockScreen">

            <h1 class="title">
                Enter the Password
            </h1>


            <p class="subtitle arabic">
                أدخلي كلمة السر
            </p>


            <!-- Password dots -->

            <div class="password-dots">

                <span class="dot" id="dot1"></span>
                <span class="dot" id="dot2"></span>
                <span class="dot" id="dot3"></span>

            </div>


            <!-- Hint -->

            <p class="hint">
                A little hint from Miko: <strong>I love you</strong>
            </p>


            <!-- ==================================================
                 KEYPAD
                 ================================================== -->

            <div class="keypad">

                <button class="key" onclick="pressNumber('1')">1</button>
                <button class="key" onclick="pressNumber('2')">2</button>
                <button class="key" onclick="pressNumber('3')">3</button>

                <button class="key" onclick="pressNumber('4')">4</button>
                <button class="key" onclick="pressNumber('5')">5</button>
                <button class="key" onclick="pressNumber('6')">6</button>

                <button class="key" onclick="pressNumber('7')">7</button>
                <button class="key" onclick="pressNumber('8')">8</button>
                <button class="key" onclick="pressNumber('9')">9</button>

                <button class="key" onclick="pressNumber('*')">*</button>
                <button class="key" onclick="pressNumber('0')">0</button>
                <button class="key" onclick="pressNumber('#')">#</button>

            </div>

        </section>


        <!-- ==================================================
             BIRTHDAY PAGE
             ================================================== -->

        <section class="birthday-page" id="birthdayPage">

            <h1 class="title">
                Happy Birthday, Rasha
            </h1>

            <p class="subtitle">
                Seventeen looks beautiful on you.
            </p>


            <!-- ==================================================
                 THREE FRIENDS PHOTO

                 PUT YOUR IMAGE HERE:

                 Replace:
                 YOUR_THREE_FRIENDS_IMAGE.jpg

                 Example:
                 <img src="friends.jpg">
                 ================================================== -->

            <img
                class="friends-photo"
                src="YOUR_THREE_FRIENDS_IMAGE.jpg"
                alt="The three of us"
            >


            <!-- ==================================================
                 HEART PHOTO

                 PUT YOUR IMAGE HERE:

                 Replace:
                 YOUR_HEART_IMAGE.jpg
                 ================================================== -->

            <img
                class="heart-photo"
                src="YOUR_HEART_IMAGE.jpg"
                alt="Birthday memory"
            >


            <!-- ==================================================
                 MORE PHOTOS CAN GO HERE

                 Copy this line whenever you want another image:

                 <img class="photo-placeholder"
                      src="YOUR_IMAGE_HERE.jpg"
                      alt="">
                 ================================================== -->


        </section>


    </main>


    <!-- ==================================================
         ERROR POPUP
         ================================================== -->

    <div class="error-card" id="errorCard">

        <div class="error-box">


            <!-- Close X -->

            <button
                class="close-error"
                onclick="closeError()">
                ×
            </button>


            <!-- ==================================================
                 ERROR IMAGE

                 PUT YOUR IMAGE HERE:

                 Replace:
                 YOUR_ERROR_IMAGE.jpg
                 ================================================== -->

            <img
                class="error-image"
                src="YOUR_ERROR_IMAGE.jpg"
                alt="Miko"
            >


            <h2 class="error-title">
                Wrong password
            </h2>


            <p class="error-text">
                Try again, birthday girl ♡
            </p>


        </div>

    </div>



    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <script>

        /* ================================================
           CORRECT PASSWORD
           
           143 = I LOVE YOU
           ================================================ */

        const correctPassword = "143";

        let enteredPassword = "";


        /* ================================================
           PRESS NUMBER
           ================================================ */

        function pressNumber(number) {

            /*
                Only allow three numbers.
            */

            if (enteredPassword.length >= 3) {
                return;
            }


            /*
                Add pressed number.
            */

            enteredPassword += number;


            /*
                Update dots.
            */

            updateDots();


            /*
                Check password after three numbers.
            */

            if (enteredPassword.length === 3) {

                setTimeout(checkPassword, 250);

            }

        }


        /* ================================================
           UPDATE PASSWORD DOTS
           ================================================ */

        function updateDots() {

            const dots = [
                document.getElementById("dot1"),
                document.getElementById("dot2"),
                document.getElementById("dot3")
            ];


            dots.forEach((dot, index) => {

                if (index < enteredPassword.length) {

                    dot.classList.add("active");

                } else {

                    dot.classList.remove("active");

                }

            });

        }


        /* ================================================
           CHECK PASSWORD
           ================================================ */

        function checkPassword() {

            if (enteredPassword === correctPassword) {

                /*
                    Correct password:
                    Hide lock screen
                    Show birthday page
                */

                document.getElementById("lockScreen").style.display = "none";

                document.getElementById("birthdayPage").style.display = "block";

            } else {

                /*
                    Wrong password:
                    Show cut
